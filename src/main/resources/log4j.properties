log4j.rootLogger=INFO, fileAppender, stdout
log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern=[%d] %p %m (%c)%n

log4j.appender.fileAppender=org.apache.log4j.FileAppender
log4j.appender.fileAppender.File=/Users/ayoub.omari/dev/kafka-streams-app/kafka-app.log
log4j.appender.fileAppender.layout=org.apache.log4j.PatternLayout
log4j.appender.fileAppender.layout.ConversionPattern=[%d] %p %m (%c)%n
log4j.appender.fileAppender.append=true
log4j.appender.stdout.append=true


# Turn on all our debugging info
log4j.logger.kafka=INFO,fileAppender,stdout
